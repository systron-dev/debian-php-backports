name: sury-watch

# Checks deb.sury.org for newer revisions of the sources pinned in targets/ and
# reports them as issues with the `sury-update` label. The rules that keep it from
# opening or commenting on issues again and again are in repo/check-sury-updates.py.

on:
  schedule:
    - cron: '23 */8 * * *'
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Testing only: pretend older pins, e.g. "php7.2=7.2.34-65" (space separated)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only the pins (targets/, and build/build.conf for php-defaults) and the script are
      # needed: a shallow, sparse checkout keeps the run short.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            targets
            build
            repo
      # A fork inherits this schedule but usually has issues disabled, so it must not
      # report. It still checks: drift makes the run fail here, so a fork learns that its
      # pins went stale instead of carrying them silently. Failures come only from drift,
      # never from a missing issue tracker.
      - name: "Compare the pinned revisions with deb.sury.org (fork: report by failing)"
        if: ${{ github.event.repository.fork }}
        env:
          SIMULATE: ${{ inputs.simulate }}
        run: |
          echo '[]' > "$RUNNER_TEMP/issues.json"
          out="$(repo/check-sury-updates.py --dry-run --issues "$RUNNER_TEMP/issues.json" \
                 $(for s in $SIMULATE; do printf -- '--simulate %s ' "$s"; done))"
          printf '%s\n' "$out"
          if grep -qE '^(update|dropped): ' <<<"$out"; then
            echo "::error::deb.sury.org has newer sources, or a watched suite is gone; update the pins"
            exit 1
          fi
      - name: Compare the pinned revisions with deb.sury.org
        if: ${{ !github.event.repository.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate }}
        run: repo/check-sury-updates.py $(for s in $SIMULATE; do printf -- '--simulate %s ' "$s"; done)

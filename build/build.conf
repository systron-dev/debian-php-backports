# Global build defaults, sourced by build/build.sh and tests/install/run.sh.
# VERSION_SUFFIX (the suffix on every version) and its override live in
# build/version-suffix.sh, which those scripts source before this file.
# Changelog author. Both can be overridden from the environment, so a local build can
# carry another name without editing this file, e.g.
#   DEBFULLNAME="Name" DEBEMAIL="mail@example.org" make build-debian11-bullseye/php7.4-sury
# CI and every build that sets nothing keep the committed values.
DEBFULLNAME="${DEBFULLNAME:-debian-php-backports}"
DEBEMAIL="${DEBEMAIL:-anima.artificialis@gmail.com}"
# php-common for the sury targets that ask for it (REBUILD_PHP_COMMON=1 in target.conf;
# every release but buster and bullseye): rebuilt in the builder image from Sury's php-defaults source
# of this version, pinned by the SHA256 of its .dsc, without the Breaks of php-common on
# older PECL extension packages (build/container/build-php-common.sh). Its version is
# Sury's own plus a suffix, the same on every release, so it sorts above the binary he
# built (which earlier releases here shipped) and above the last php-common of his old
# suites and PPA. Raise the suffix when php-common is rebuilt with a change.
PHP_COMMON_SOURCE_VERSION=101+debsuryorg12.1+php+1
PHP_COMMON_DSC_SHA256=4470c776bcb485c83f4aa339e772b7ca297e1616d83625b105ad353dfa25228c
PHP_COMMON_VERSION="2:${PHP_COMMON_SOURCE_VERSION}${VERSION_SUFFIX}"
# Passed to DEB_BUILD_OPTIONS; nocheck skips the (very long) upstream test suite
NPROC="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
DEB_BUILD_OPTIONS="nocheck parallel=${NPROC}"

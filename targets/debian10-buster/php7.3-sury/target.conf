# Target: PHP 7.3 for Debian 10 buster (sourced by bash)
#
# Buster's own PHP 7.3 is only fixed in Freexian ELTS; deb.sury.org stopped
# building for buster. This target rebuilds Sury's current php7.3 package,
# which already contains the fixes, so buster gets a free source with the
# newer backports as well. Source is his complete php7.3 source package;
# no extra patches are added.
DEBIAN_CODENAME=buster
DEBIAN_VERSION=10
BASE_IMAGE=docker.io/library/debian:buster-slim
# Architectures to build, natively on a runner of each (the base image is multi-arch).
ARCHES="amd64 arm64"
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=buster/updates
SOURCE_PACKAGE=php7.3
# Version as used in the file names
SOURCE_VERSION=7.3.33-41+debsuryorg12.1+php+1
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.3
SOURCE_DSC_SHA256=5c923c0a77cf8b34a34756428f37bcce29fc6ad675941982a80e30ae9329abf4
# Build dependencies come from Sury's dsc, not from buster's own php7.3 source.
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above buster's php7.3 (7.3.31-1~deb10uN) and Sury's last buster builds.
# The suffix is swapped for VERSION_SUFFIX when a build overrides it (build/version-suffix.sh).
NEW_VERSION="7.3.33-41+debsuryorg12.1+php+1+debian10+animaa1"
SURY_SOURCE_PACKAGE=php7.3
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
# Sury's DNS telemetry patch (telemetry.sury.org) is not wanted in our rebuilds.
DROP_PATCHES="0125-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch 0224-Add-support-for-more-text-payload-to-send-CVE-number.patch"
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.3 7.3.33-41 for Debian 10 buster (includes the November 2026 fixes CVE-2026-129538, CVE-2026-129496, CVE-2026-129289, CVE-2026-129292, CVE-2026-129291, CVE-2026-128090, CVE-2026-126714, CVE-2026-115560, CVE-2026-15353, CVE-2026-129506, CVE-2026-128064, CVE-2026-127960 and the earlier bailout mitigation for CVE-2026-109618 and CVE-2026-109619)."
# Packages installed by tests/install; buster ships php7.3, so the negative case runs.
TEST_PACKAGES="php7.3-cli php7.3-fpm"
TEST_CVE_ID=CVE-2026-129538
TEST_PHP_BINARY=php7.3

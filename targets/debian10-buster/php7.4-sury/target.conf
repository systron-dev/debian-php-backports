# Target: PHP 7.4 for Debian 10 buster (sourced by bash)
#
# Buster never shipped PHP 7.4; it came from deb.sury.org, which dropped buster.
# Source is therefore Ondřej Surý's complete php7.4 source package (it already
# contains the CVE-2026-109618/109619 fix as debian/patches/0163-...), rebuilt
# on buster. No extra patches are added.
DEBIAN_CODENAME=buster
DEBIAN_VERSION=10
BASE_IMAGE=docker.io/library/debian:buster-slim
# Architectures to build, natively on a runner of each (the base image is multi-arch).
ARCHES="amd64 arm64"
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=buster/updates
SOURCE_PACKAGE=php7.4
# Version as used in the file names (the package version itself has epoch 1:)
SOURCE_VERSION=7.4.33-37+debsuryorg12.1+php+1
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.4
SOURCE_DSC_SHA256=785092eb556696ad1ef1ce66eaf0004d7c2fb655f8598c5a1fdb305cdfb204ba
# php7.4 is not in the buster archive, so build dependencies come from the dsc.
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last buster builds (1:7.4.33-N+0~...+debian10~1.gbp...).
# The suffix is swapped for VERSION_SUFFIX when a build overrides it (build/version-suffix.sh).
NEW_VERSION="1:7.4.33-37+debsuryorg12.1+php+1+debian10+animaa1"
SURY_SOURCE_PACKAGE=php7.4
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
# Sury's DNS telemetry patch (telemetry.sury.org) is not wanted in our rebuilds.
DROP_PATCHES="0127-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch 0197-Add-support-for-more-text-payload-to-send-CVE-number.patch"
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.4 7.4.33-37 for Debian 10 buster (includes the November 2026 fixes CVE-2026-129538, CVE-2026-129496, CVE-2026-129289, CVE-2026-129292, CVE-2026-129291, CVE-2026-128090, CVE-2026-126714, CVE-2026-115560, CVE-2026-15353, CVE-2026-129506, CVE-2026-128064, CVE-2026-127960 and the earlier bailout mitigation for CVE-2026-109618 and CVE-2026-109619)."
# Packages installed by tests/install (no stock php7.4 on buster: negative case is skipped)
TEST_PACKAGES="php7.4-cli php7.4-fpm"
TEST_CVE_ID=CVE-2026-129538
TEST_PHP_BINARY=php7.4

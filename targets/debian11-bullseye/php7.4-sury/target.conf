# Target: PHP 7.4 for Debian 11 bullseye (sourced by bash)
#
# Bullseye shipped PHP 7.4, but the 7.4 packages of deb.sury.org that many servers
# installed came from his bullseye suite, which he stopped updating in October 2026
# and removes in November 2026. The release's own 7.4 is fixed in Freexian ELTS
# (see the README); this target rebuilds Sury's newer package, which already
# contains the fixes, for the servers that run his version and want it to stay
# above his last bullseye build (1:7.4.33-31+...debian11~1).
# Source is his complete php7.4 source package; no extra patches are added.
DEBIAN_CODENAME=bullseye
DEBIAN_VERSION=11
BASE_IMAGE=docker.io/library/debian:bullseye-slim
# Architectures to build, natively on a runner of each (the base image is multi-arch).
ARCHES="amd64 arm64"
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=bullseye-security
SOURCE_PACKAGE=php7.4
# Bookworm's variant of Sury's source, as on buster: the trixie and bookworm sources
# differ only in debian/changelog, and bookworm is closer to bullseye.
SOURCE_VERSION=7.4.33-37+debsuryorg12.1+php+1
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.4
SOURCE_DSC_SHA256=785092eb556696ad1ef1ce66eaf0004d7c2fb655f8598c5a1fdb305cdfb204ba
# Build dependencies come from Sury's dsc, not from the bullseye archive's own php7.4
# source: his packaging can need more than Debian's.
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last bullseye builds (1:7.4.33-N+0~...+debian11~1.gbp...) and
# above Freexian ELTS's 7.4.33-1+deb11uN (no epoch). That comparison relies on the
# "+debsuryorg" source scheme; a later build of his old bullseye suite (1:7.4.33-38+0~...)
# would sort higher, but he ended that suite in November 2026 and does not publish there.
# On a newer pinned revision, bump this version the same way.
# The suffix is swapped for VERSION_SUFFIX when a build overrides it (build/version-suffix.sh).
NEW_VERSION="1:7.4.33-37+debsuryorg12.1+php+1+debian11+animaa1"
SURY_SOURCE_PACKAGE=php7.4
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
# Sury's DNS telemetry patch (telemetry.sury.org) is not wanted in our rebuilds.
DROP_PATCHES="0127-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch 0197-Add-support-for-more-text-payload-to-send-CVE-number.patch"
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.4 7.4.33-37 for Debian 11 bullseye (CVE-2026-129538, CVE-2026-129496, CVE-2026-129289, CVE-2026-129292, CVE-2026-129291, CVE-2026-128090, CVE-2026-126714, CVE-2026-115560, CVE-2026-15353, CVE-2026-129506, CVE-2026-128064, CVE-2026-127960)."
# Packages installed by tests/install; bullseye has stock php7.4, so the negative case runs.
TEST_PACKAGES="php7.4-cli php7.4-fpm"
TEST_CVE_ID=CVE-2026-129538
TEST_PHP_BINARY=php7.4

# Target: PHP 7.0 for Debian 9 stretch (sourced by bash)
#
# Stretch's own PHP 7.0 is only fixed in Freexian ELTS; deb.sury.org stopped
# building for stretch. This target rebuilds Sury's current php7.0 package,
# which already contains the fixes, so stretch gets a free source with the
# newer backports as well. Source is his complete php7.0 source package;
# no extra patches are added.
DEBIAN_CODENAME=stretch
DEBIAN_VERSION=9
BASE_IMAGE=docker.io/library/debian:stretch-slim
# amd64 only, as the other stretch targets: older releases were rarely run on arm64.
ARCHES="amd64"
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=stretch/updates
# php7.0 needs php-common (>= 1:81~); stretch has 1:49. Sury's binary php-common
# breaks older PECL extension packages (php-apcu, php-imagick, php-redis, ...:
# limits meant for PHP 8), so apt would remove working extensions with the
# upgrade. It is rebuilt from his php-defaults source without that field and
# ships with the packages (pins in build/build.conf,
# build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# Nothing else from a newer release: php7.0 uses PCRE1 (stretch has 8.39, no
# libpcre2), stretch's libzip 1.1.2 and libtidy 5.2.0 satisfy the build, and
# php7.0 has no argon2.
# Sury's DNS telemetry patch (telemetry.sury.org) is not wanted in our rebuilds.
DROP_PATCHES="0220-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch 0351-Add-support-for-more-text-payload-to-send-CVE-number.patch"
SOURCE_PACKAGE=php7.0
# Debian 12 variant, as on the other targets: the newer revisions are published
# only for Debian 12/13 and Ubuntu 22.04+, and differ only in the changelog.
SOURCE_VERSION=7.0.33-97+debsuryorg12.1+php+1
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.0
SOURCE_DSC_SHA256=df0cd67c4047154a58fa78f63cf67c1f21e200e79cf5402190147fe9a453105a
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above stretch's php7.0 (7.0.33-0+deb9uN) and Sury's last stretch builds.
NEW_VERSION="7.0.33-97+debsuryorg12.1+php+1+debian9+animaa1"
SURY_SOURCE_PACKAGE=php7.0
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.0 7.0.33-97 for Debian 9 stretch (includes the November 2026 fixes CVE-2026-129538, CVE-2026-129496, CVE-2026-129289, CVE-2026-129292, CVE-2026-129291, CVE-2026-128090, CVE-2026-126714, CVE-2026-115560, CVE-2026-15353, CVE-2026-129506, CVE-2026-128064, CVE-2026-127960 and the earlier bailout mitigation for CVE-2026-109618 and CVE-2026-109619; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
# Packages installed by tests/install; stretch ships php7.0, so the negative case runs.
TEST_PACKAGES="php7.0-cli php7.0-fpm"
# Stand-ins for extension packages a server has (versions in Sury's style): below the
# limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.18+4.0.11-1+0~20191218.26+debian9~1 php-imagick=3.4.4-1+0~20190606.3+debian9~1"
TEST_CVE_ID=CVE-2026-129538
TEST_PHP_BINARY=php7.0
